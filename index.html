<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="icon-container">
            <img src="./images/signupicon.png" alt="" height="100px">
        </div>
        <div class="signup-container">
            <div class="container-text">
                <h1>sign up now to our wow private server</h1>
                <p><em>the real wow mmo expierence</em></p>
            </div>
            <div class="signup-form">
                <form action="" method="post" class="form">
                <h1>Sign up:</h1>
                <label for="username">username:</label>
                <input type="text" name="username" id="username" placeholder="choose a username..">
                <label for="password:">password:</label>
                <input type="text" name="password" id="password" placeholder="at least 8 letters">
                <label for="confirmpassword">confirm password:</label>
                <input type="text" name="confirmpassword" id="confirmpassword" placeholder="repeat your password..">
</form>
            </div>
        </div>

    </main>
</body>
</html>
