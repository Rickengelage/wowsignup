<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Metamorphous&display=swap" rel="stylesheet">
   
</head>
<body>

    <main class="main-content">
        <!-- the icon section -->
        <div class="icon-container">
            <img src="./images/signupicon.png" alt="" height="100px">
        </div>
        <!-- sign up section to the right -->
             <div class="signup-container">
                <!-- sign up header text -->
             <div class="container-text">
                <h1>sign up now to our wow private server</h1>
                <p><em>the real wow mmo expierence</em></p>
            </div> 
            <!-- the actual form where people enter their info -->
             <div class="signup-form">
                <form action="" method="get" class="form">
                <!-- title of the form -->
                     <h1>Sign up:</h1>
                <!-- asking to choose username -->
                 <div>
                    <label for="username">*Username:</label>
                    <input type="text" name="username" id="username" placeholder="choose a username.." required > 
                 </div>
                    <!-- asking for a password with at least 8 letters -->
                   <div>
                    <label for="password:">*Password:</label>
                    <input type="password" name="password" id="password" placeholder="at least 8 letters" minlength="8" required>
               </div>
                    <!-- asking to confirm the password -->
                <div>
                     <label for="confirmpassword">*Confirm password:</label>
                     <input type="password" name="confirmpassword" id="confirmpassword" placeholder="repeat your password.." minlength="8" required>
               </div>
                     <!-- asking for an email adress -->
                <div>
                     <label for="email">*Email:</label>
                     <input type="email" name="email" id="email" placeholder="example@example.com" required>
             </div>
                  <div>   <!-- the submit button -->
                     <button type="submit" class="submit-btn">Submit</button>
                    </div>
                </form>

            </div>
        </div>
    </main>
</body>
</html>
